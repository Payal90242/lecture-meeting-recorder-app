name: ai_voice_summarizer
description: "AI Voice Note & Lecture Summarizer with Gemini API, SQLite, and RevenueCat Paywall"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # State Management
  provider: ^6.1.2

  # Microphone & Audio Recording
  record: ^5.1.2
  audioplayers: ^6.0.0

  # Local SQLite Persistence & File System
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # AI & Cloud API
  google_generative_ai: ^0.4.6
  http: ^1.2.2

  # Subscriptions & In-App Purchases
  purchases_flutter: ^8.1.0

  # Sharing & Utilities
  share_plus: ^10.0.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
